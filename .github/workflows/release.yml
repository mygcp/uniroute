name: Release — uni binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: uni-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: uni-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: uni-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: uni-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: uni-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: compile
        # Bun 1.3.14 sudah potong 4M di Linux — jaga tetap ramping: --minify, hindari --bytecode
        run: bun build cli/uni.ts --compile --minify --sourcemap=none --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
        shell: bash
      - name: UPX compress (optional)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          if command -v upx >/dev/null 2>&1; then upx --best dist/${{ matrix.artifact }} && ls -lh dist/${{ matrix.artifact }}; else echo "UPX not installed — skip (install upx-ucl for final compression)"; fi
        shell: bash
      - name: package tarball (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }} -C .. build
          # also standalone binary as asset
          ls -lh dist/
        shell: bash
      - name: package zip (windows)
        if: runner.os == 'Windows'
        run: |
          7z a dist/${{ matrix.artifact }}.zip ./dist/${{ matrix.artifact }} ./build
          ls -lh dist/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
            build/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
