name: Release — uni binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: sync version from tag (prepare)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          bun -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");' "$TAG_VER"
        shell: bash
      - run: bun run bundle
      - name: verify build and bundle artifacts
        run: |
          test -f build/server/index.js
          test -f build/client-assets.js
          test -f dist/uni-bundle.tar.gz
          ls -lh dist/uni-bundle.tar.gz
        shell: bash
      - name: smoke test bundle under bun and node
        run: |
          SMOKE="$RUNNER_TEMP/bundle-smoke"
          rm -rf "$SMOKE" && mkdir -p "$SMOKE"
          tar -xzf dist/uni-bundle.tar.gz -C "$SMOKE"
          UNIROUTE_INSTALL_MODE=bundle UNIROUTE_APP_DIR="$SMOKE" bun "$SMOKE/uni.mjs" version
          UNIROUTE_INSTALL_MODE=bundle UNIROUTE_APP_DIR="$SMOKE" bun "$SMOKE/uni.mjs" doctor
          UNIROUTE_INSTALL_MODE=bundle UNIROUTE_APP_DIR="$SMOKE" node --no-warnings=ExperimentalWarning "$SMOKE/uni.mjs" version
          UNIROUTE_INSTALL_MODE=bundle UNIROUTE_APP_DIR="$SMOKE" node --no-warnings=ExperimentalWarning "$SMOKE/uni.mjs" doctor
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
      - uses: actions/upload-artifact@v7
        with:
          name: uni-bundle
          path: dist/uni-bundle.tar.gz

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: uni-linux-x64
            native: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: uni-linux-arm64
            native: false
          - os: macos-latest
            target: bun-darwin-x64
            artifact: uni-darwin-x64
            native: false
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: uni-darwin-arm64
            native: true
          - os: windows-latest
            target: bun-windows-x64
            artifact: uni-windows-x64.exe
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: build/
      - run: bun install --frozen-lockfile
      - name: sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          bun -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");' "$TAG_VER"
        shell: bash
      - name: compile
        run: |
          test -f build/client-assets.js
          bun build cli/uni-compiled.ts --compile --minify --sourcemap=none --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
          ls -lh dist/${{ matrix.artifact }}
        shell: bash
      - name: verify embedded client assets
        run: |
          bun -e '
            const fs = require("node:fs");
            const manifest = fs.readFileSync("build/client-assets.js", "utf8");
            const m = manifest.match(/\/assets\/root-[A-Za-z0-9_-]+\.js/);
            if (!m) throw new Error("root asset missing from build/client-assets.js");
            const bin = fs.readFileSync(process.argv[1]);
            if (!bin.includes(Buffer.from(m[0]))) {
              throw new Error(`embedded asset key ${m[0]} not found in ${process.argv[1]}`);
            }
            console.log("verified embedded asset key:", m[0]);
          ' "dist/${{ matrix.artifact }}"
        shell: bash
      - name: smoke test standalone binary
        if: matrix.native == true
        run: |
          BIN="$(pwd)/dist/${{ matrix.artifact }}"
          SMOKE="$RUNNER_TEMP/uni-smoke"
          rm -rf "$SMOKE" && mkdir -p "$SMOKE"
          cd "$SMOKE"
          export DATABASE_URL="$SMOKE/data/test.db"
          export UNIROUTE_PID_FILE="$SMOKE/data/uni.pid"
          "$BIN" version
          "$BIN" doctor
          "$BIN" start --port 13987 --host 127.0.0.1 > "$SMOKE/out.log" 2> "$SMOKE/err.log" &
          PID=$!
          trap '"$BIN" stop 2>/dev/null || kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13987/login > "$SMOKE/login.html" 2>/dev/null; then
              break
            fi
            sleep 0.3
          done
          test -s "$SMOKE/login.html"
          ROOT_JS="$(grep -oE '/assets/root-[A-Za-z0-9_-]+\.js' "$SMOKE/login.html" | head -n 1)"
          ROOT_CSS="$(grep -oE '/assets/root-[A-Za-z0-9_-]+\.css' "$SMOKE/login.html" | head -n 1)"
          test -n "$ROOT_JS"
          test -n "$ROOT_CSS"
          curl -fsSI "http://127.0.0.1:13987${ROOT_JS}"
          curl -fsSI "http://127.0.0.1:13987${ROOT_CSS}"
          curl -fsSI "http://127.0.0.1:13987/favicon.ico"
          ! grep -q "No route matches URL" "$SMOKE/err.log"
        shell: bash
      - name: package tarball (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }}
          ls -lh dist/
        shell: bash
      - name: package zip (windows)
        if: runner.os == 'Windows'
        run: |
          7z a dist/${{ matrix.artifact }}.zip ./dist/${{ matrix.artifact }}
          ls -lh dist/
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist; echo "--- files for release:"; find dist -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/uni-*
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/uni-bundle.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
