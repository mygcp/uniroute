name: Release — uni binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: uni-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: uni-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: uni-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: uni-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: uni-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: build/
      - run: bun install --frozen-lockfile
      - name: compile
        run: bun build cli/uni.ts --compile --minify --sourcemap=none --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
        shell: bash
      - name: install UPX
        if: runner.os != 'Windows' && matrix.target == 'bun-linux-x64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends upx-ucl
        shell: bash
      - name: install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx
        shell: bash
      - name: UPX compress
        if: matrix.target == 'bun-linux-x64' || startsWith(matrix.target, 'bun-darwin')
        run: |
          timeout 90 upx -1 dist/${{ matrix.artifact }} && ls -lh dist/${{ matrix.artifact }} || echo "UPX skip/timeout — keep uncompressed"
          gzip -c dist/${{ matrix.artifact }} | wc -c | awk '{printf "gzip: %.1fM\n", $1/1024/1024}'
        shell: bash
      - name: gzip size (no UPX)
        if: matrix.target == 'bun-linux-arm64'
        run: |
          ls -lh dist/${{ matrix.artifact }}
          gzip -c dist/${{ matrix.artifact }} | wc -c | awk '{printf "gzip: %.1fM\n", $1/1024/1024}'
        shell: bash
      - name: package tarball (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }} -C .. build
          # also standalone binary as asset
          ls -lh dist/
        shell: bash
      - name: package zip (windows)
        if: runner.os == 'Windows'
        run: |
          7z a dist/${{ matrix.artifact }}.zip ./dist/${{ matrix.artifact }} ./build
          ls -lh dist/
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
            build/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist; echo "--- files for release:"; find dist -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/uni-*
            dist/**/*.tar.gz
            dist/**/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  trigger-android:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIROUTE_PAT }}
          repository: mygcp/uniroute-android
          event-type: uniroute-tag
          client-payload: '{"tag": "${{ github.ref_name }}"}'
